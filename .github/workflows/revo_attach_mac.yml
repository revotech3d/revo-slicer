# Attaches a Mac DMG built locally to an existing [r]evo Slicer release (used when no macOS runner is available).
# The DMG is pushed in parts to a temporary branch; this job joins them, checks the SHA-256 and uploads the file.
name: Revo Slicer – attach local Mac DMG
on:
  workflow_dispatch:
    inputs:
      wersja:
        description: '[r]evo Slicer version, e.g. 1.0.8'
        type: string
      galaz:
        description: 'Temporary branch with the DMG parts'
        type: string
      sha256:
        description: 'SHA-256 of the whole DMG'
        type: string
jobs:
  attach:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.galaz }}
      - name: Join, verify and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          f="RevoSlicer_Mac_AppleSilicon_${{ inputs.wersja }}.dmg"
          cat parts/p_* > "$f"
          echo "${{ inputs.sha256 }}  $f" | sha256sum -c -
          gh release upload "v${{ inputs.wersja }}" "$f" -R "${{ github.repository }}" --clobber
