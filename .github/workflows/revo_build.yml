# [r]evo Slicer – budowanie dla Windows (x64) i macOS (tylko Apple Silicon). Linux nie jest wspierany.
name: Revo Slicer – build
on:
  push:
    branches: [revo]
  workflow_dispatch:
    inputs:
      wydaj:
        description: 'Opublikuj wydanie po udanej kompilacji'
        type: boolean
        default: false
      wersja:
        description: 'Wersja [r]evo Slicer, np. 1.0.0'
        type: string
        default: '1.0.0'
      mac:
        description: 'Buduj też wersję na Maca (wyłącz, gdy DMG robimy lokalnie)'
        type: boolean
        default: true
jobs:
  windows:
    name: Windows x64
    permissions:
      actions: write
      contents: write
      id-token: write
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: windows-latest
      arch: x64
      compiler: clang
    secrets: inherit
  macos_arch:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mac }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: macos-15
      arch: ${{ matrix.arch }}
    secrets: inherit

  # Wydanie: tylko z ręcznego uruchomienia z „wydaj: true”. Instalator Windows + aplikacja Mac (DMG, bez podpisu Apple).
  wydanie:
    name: Wydanie [r]evo Slicer
    needs: [windows, macos_arch]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.wydaj && needs.windows.result == 'success' && (needs.macos_arch.result == 'success' || !inputs.mac) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: art
      - name: Pakowanie
        run: |
          set -e
          mkdir -p out
          find art -name 'RevoSlicer_Windows_Installer_*.exe' -exec cp {} out/RevoSlicer_Windows_x64_${{ inputs.wersja }}.exe \;
          find art -name 'RevoSlicer_Mac_arm64_*.dmg' -exec cp {} out/RevoSlicer_Mac_AppleSilicon_${{ inputs.wersja }}.dmg \;
          test -f out/RevoSlicer_Windows_x64_${{ inputs.wersja }}.exe
          if [ "${{ inputs.mac }}" = "true" ]; then test -f out/RevoSlicer_Mac_AppleSilicon_${{ inputs.wersja }}.dmg; fi
          ls -la out
      - name: Publikacja
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ inputs.wersja }}" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "v${{ inputs.wersja }}" out/* -R "${{ github.repository }}" --clobber
            exit 0
          fi
          gh release create "v${{ inputs.wersja }}" out/* -R "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "[r]evo Slicer ${{ inputs.wersja }}" \
            --notes "[r]evo Slicer ${{ inputs.wersja }} – slicer Revotech dla drukarek Revon. Sometimes evolution. Sometimes [r]evolution.

          Windows: uruchom instalator; jeśli pojawi się „System Windows ochronił ten komputer” – Więcej informacji → Uruchom mimo to. Mac (Apple Silicon): otwórz plik .dmg i przeciągnij [r]evo Slicer do Aplikacji; przy pierwszym uruchomieniu prawy przycisk → Otwórz → Otwórz."
