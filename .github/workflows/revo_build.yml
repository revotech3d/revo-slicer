# [r]evo Slicer – builds for Windows (x64) and macOS (Apple Silicon only). Linux is not supported.
name: Revo Slicer – build
on:
  push:
    branches: [revo]
  workflow_dispatch:
    inputs:
      wydaj:
        description: 'Publish a release after a successful build'
        type: boolean
        default: false
      wersja:
        description: '[r]evo Slicer version, e.g. 1.0.0'
        type: string
        default: '1.0.0'
      mac:
        description: 'Also build the Mac version (turn off when the DMG is built locally)'
        type: boolean
        default: true
      opis:
        description: "What's new (added to the release notes, in English)"
        type: string
        default: ''
jobs:
  version_check:
    name: Version matches version.inc
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.wydaj }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: REVO_SLICER_VERSION must equal the release version
        run: |
          v=$(grep 'set(REVO_SLICER_VERSION' version.inc | cut -d '"' -f2)
          [ "$v" = "${{ inputs.wersja }}" ] || { echo "::error::version.inc has $v, release is ${{ inputs.wersja }} – bump REVO_SLICER_VERSION first"; exit 1; }
  windows:
    needs: [version_check]
    if: ${{ !failure() && !cancelled() }}
    name: Windows x64
    permissions:
      actions: write
      contents: write
      id-token: write
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: windows-latest
      arch: x64
      compiler: clang
    secrets: inherit
  macos_arch:
    needs: [version_check]
    if: ${{ !failure() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.mac) }}
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: macos-15
      arch: ${{ matrix.arch }}
    secrets: inherit

  # Wydanie: tylko z ręcznego uruchomienia z „wydaj: true”. Instalator Windows + aplikacja Mac (DMG, bez podpisu Apple).
  wydanie:
    name: Wydanie [r]evo Slicer
    needs: [windows, macos_arch]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.wydaj && needs.windows.result == 'success' && (needs.macos_arch.result == 'success' || !inputs.mac) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: art
      - name: Pakowanie
        run: |
          set -e
          mkdir -p out
          find art -name 'RevoSlicer_Windows_Installer_*.exe' -exec cp {} out/RevoSlicer_Windows_x64_${{ inputs.wersja }}.exe \;
          find art -name 'RevoSlicer_Mac_arm64_*.dmg' -exec cp {} out/RevoSlicer_Mac_AppleSilicon_${{ inputs.wersja }}.dmg \;
          test -f out/RevoSlicer_Windows_x64_${{ inputs.wersja }}.exe
          if [ "${{ inputs.mac }}" = "true" ]; then test -f out/RevoSlicer_Mac_AppleSilicon_${{ inputs.wersja }}.dmg; fi
          ls -la out
      - name: Publikacja
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ inputs.wersja }}" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "v${{ inputs.wersja }}" out/* -R "${{ github.repository }}" --clobber
            exit 0
          fi
          gh release create "v${{ inputs.wersja }}" out/* -R "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "[r]evo Slicer ${{ inputs.wersja }}" \
            --notes "[r]evo Slicer ${{ inputs.wersja }} – the Revotech slicer for Revon printers. Sometimes evolution. Sometimes [r]evolution.

          ${{ inputs.opis }}

          Windows: run the installer; if you see "Windows protected your PC", choose More info → Run anyway. Mac (Apple Silicon): open the .dmg and drag [r]evo Slicer to Applications; on first launch right-click → Open → Open."
