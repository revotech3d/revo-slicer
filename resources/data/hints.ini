# THIS DOCUMENT CONTAINS DATA FOR HINTS NOTIFICATIONS
#
# Each notification is divided by 
# [hint:*name of notification*]
#
# Each notification MUST have text var in format:
# text = Headline of hint\nBody of hint.
# Headline is divided by new line (\n) from body.
# Headline is automaticaly printed as Bold.
# Body can contain bold marks: <b>text to be bold</b> (currently rendered as different color, not bold due to font limitations)
# Body can contain hypertext: <a>hypertext text</a>
# Hypertext must be max one per notification and must be closed by </a>
#
# Notification can have documentation link
#
# If notification contains hypertext, it needs to be specified by hypertext_type var.
# each type needs to be supported with one or more additional vars.
# These types are possible:
#
# Settings highlight (like search feature)
# hypertext_type = settings
# hypertext_settings_opt = name_of_settings (hover over settings value and copy last line of hover text)
# hypertext_settings_type = 1 (1 - 5 according to settings tab - to be channged to name of tabs instead of numbers)
# hypertext_settings_category = Infill (name of panel - written on left in settings)
#
# Plater top toolbar highlight
# hypertext_type = plater
# hypertext_plater_item = nameofbutton (internal name of GLToolbar items)
# 
# Plater gizmos (left) toolbar highlight
# hypertext_type = gizmo
# hypertext_gizmo_item = name (name of svg icon of gizmo in resources without .svg suffix)
#
# Open preferences (might add item to highlight)
# hypertext_type = preferences
# hypertext_preferences_page = name of the prefernces tab
# hypertext_preferences_item = show_collapse_button (name of variable saved in prusaslicer.ini connected to the setting in preferences)
#
# Open gallery (no aditional var)
# hypertext_type = gallery
#
#Open top menubar item 
#hypertext_menubar_menu_name =  (Name in english visible as menu name: File, )
#hypertext_menubar_item_name =  (Name of item in english, if there are three dots at the end of name, put name without three dots)
#
#
# Each notification can have disabled and enabled modes and techs - divided by ; and space 
# enabled_tags = ...
# disabled_tags = ...
# supported tags are: simple; advanced; expert; FFF; MMU; SLA; Windows; Linux; OSX;
# and all filament types:  PLA; PET; ABS; ASA; FLEX; HIPS; EDGE; NGEN; NYLON; PVA; PC; PP; PEI; PEEK; PEKK; POM; PSU; PVDF; SCAFF; 
# Tags are case sensitive. 
# FFF is affirmative for both one or more extruder printers.
# Algorithm shows hint only if ALL enabled tags are affirmative. (so never do enabled_tags = FFF; SLA;)
# Algorithm shows hint only if not in all disabled tags.
# if there are both disabled and preferred, only preferred that are not in disabled are valid.
#
#
# Notifications shows in random order, already shown notifications are saved at cache/hints.cereal (as binary - human non-readable)
# You can affect random ordering by seting weigh
# weight = 5
# Weight must be larger or equal to 1. Default weight is 1.
# Weight defines probability as weight : sum_of_all_weights.

[hint:Sometimes evolution. Sometimes (r)evolution]
text = Sometimes evolution. Sometimes [r]evolution\nWelcome to [r]evo Slicer – built by Revotech for Revon printers. Your machines, nozzles, hotends, beds and Revo filaments are already installed.
documentation_link = https://revo3d.pl/oprogramowanie/

[hint:Three levels: Newbie, Pro, Monek]
text = Three levels: Newbie, Pro, Monek\nUse the switch above the process settings. <b>Newbie</b> shows the basics, <b>Pro</b> shows everything, <b>Monek</b> shows the settings Revotech recommends changing.
documentation_link = https://revo3d.pl/poziomy-newbie-pro-monek/

[hint:Find any setting in Monek]
text = Find any setting in Monek\nIn the Monek level, settings outside the recommended list are still there – search for them and they stay visible from then on.

[hint:Quick print setup]
text = Quick print setup\nNot sure where to start? Calibration → [r]evo quick print setup: pick material, quality and strength, and you are ready to slice.

[hint:Connect your Revon]
text = Connect your Revon\nCalibration → Connect to Revon printer: enter revon.local (or the IP from the printer screen) and the manager's login and PIN. Then Print sends the file straight to the machine.
documentation_link = https://revo3d.pl/polaczenie-revo-slicer-z-drukarka-revon/

[hint:Revo Panel inside the slicer]
text = Revo Panel inside the slicer\nOnce connected, the Device tab shows Revo Panel: live view, camera, temperatures and controls – without leaving the slicer.

[hint:Standard or High Flow hotend]
text = Standard or High Flow hotend\nPick the hotend in the printer settings: <b>Standard</b> is NextG UHF, <b>High Flow</b> is Rapido X (Hotend Turbo). Revo filament profiles know the max flow of both.

[hint:Smooth or textured bed]
text = Smooth or textured bed\nRevon printers take a smooth or a textured PEI plate. Choose the plate on the left panel – bed temperatures follow the material profile.

[hint:Nozzles 0.4 to 1.2 mm]
text = Nozzles 0.4 to 1.2 mm\nEvery Revon has profiles for 0.4, 0.6, 0.8, 1.0 and 1.2 mm nozzles. Bigger nozzle, thicker layers, faster large parts.

[hint:Calibrate a new filament]
text = Calibrate a new filament\nMonek level: Calibration → [r]evo profile wizard walks you through five test prints – temperature, max flow, pressure advance, flow ratio and retraction – and saves a new filament profile.
documentation_link = https://revo3d.pl/poziomy-newbie-pro-monek/

[hint:Licence]
text = Licence\nOne Revotech licence number activates both [r]evo Slicer and your Revon printer. Offline, the slicer keeps working for up to 14 days.
documentation_link = https://revo3d.pl/instalacja-revo-slicer/

[hint:Belt printer]
text = Belt printer\nOn Revon Belt the belt moves the print forward – long parts and series are no problem. The belt is driven by the printer's own macros.

[hint:Auto-arrange and auto-orient]
text = Auto-arrange and auto-orient\nPress <b>A</b> to arrange all objects on the bed and use auto-orient to put the part on its best face.

[hint:Supports where you need them]
text = Supports where you need them\nUse support painting to add supports only where the part needs them – less material, cleaner surfaces.

[hint:Strong parts]
text = Strong parts\nFor strength add walls before infill: 4 walls at 20% infill are usually stronger than 2 walls at 40%.

[hint:Avoid warping on ABS and ASA]
text = Avoid warping on ABS and ASA\nClose the chamber, use a brim and let the bed and chamber heat up before the first layer.

[hint:Need help?]
text = Need help?\nHelp → Contact Revotech service, or write to biuro@revo3d.pl. Revo OS sends diagnostics only with your consent.
documentation_link = https://revo3d.pl/serwis-drukarek-3d/

